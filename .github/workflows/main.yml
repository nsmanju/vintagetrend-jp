name: Build Windows exe
on: [push, workflow_dispatch]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exe
        run: g++ engine/trend_engine.cpp -o engine/trend_engine.exe
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: trend_engine-windows
          path: engine/trend_engine.exe
